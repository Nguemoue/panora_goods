<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="pg-blue" x1="88" y1="116" x2="424" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0ea5e9"/>
            <stop offset="48%" stop-color="#005cb2"/>
            <stop offset="100%" stop-color="#003a70"/>
        </linearGradient>
        <linearGradient id="pg-orange" x1="196" y1="36" x2="380" y2="472" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffb15e"/>
            <stop offset="50%" stop-color="#f58634"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
    </defs>

    <!-- Shopping Bag Handle rising from the top of the P -->
    <path
        d="M210 144V110C210 56 326 56 326 110V144"
        stroke="url(#pg-orange)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Bold Geometric "P" (transparent background) -->
    <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M138 134H322C390 134 434 176 434 238C434 300 390 342 322 342H198V422C198 446 179 464 154 464H138C113 464 94 446 94 422V178C94 153 113 134 138 134ZM198 204V272H314C339 272 356 258 356 238C356 218 339 204 314 204H198Z"
        fill="url(#pg-blue)"
    />

    <!-- Bag Handle Anchor Rivets -->
    <circle cx="210" cy="166" r="12" fill="#ffffff"/>
    <circle cx="210" cy="166" r="6" fill="url(#pg-orange)"/>
    <circle cx="326" cy="166" r="12" fill="#ffffff"/>
    <circle cx="326" cy="166" r="6" fill="url(#pg-orange)"/>

    <!-- Crisp E-Commerce Shopping Cart in lower-right negative space -->
    <path
        d="M224 374H250L268 436H364L382 392H260"
        stroke="url(#pg-orange)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
    <circle cx="282" cy="466" r="17" fill="url(#pg-orange)"/>
    <circle cx="352" cy="466" r="17" fill="url(#pg-orange)"/>
</svg>
