name: Deploy develop to OVH Plesk

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/pest --compact

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to OVH Plesk
    runs-on: ubuntu-latest
    needs: validate-and-build
    environment: develop

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Prepare application on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          PHP_BIN: ${{ secrets.OVH_PHP_BIN }}
          COMPOSER_BIN: ${{ secrets.OVH_COMPOSER_BIN }}
        with:
          host: ${{ secrets.OVH_HOST }}
          port: ${{ secrets.OVH_PORT }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SHA,PHP_BIN,COMPOSER_BIN
          script: |
            set -e

            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"

            cd "$DEPLOY_PATH"

            "$PHP_BIN" artisan down --retry=60 || true
            trap '"$PHP_BIN" artisan up || true' EXIT

            git fetch origin develop
            git checkout develop
            git reset --hard "$DEPLOY_SHA"

            "$COMPOSER_BIN" install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

            trap - EXIT

      - name: Upload built frontend assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          port: ${{ secrets.OVH_PORT }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          source: public/build
          target: ${{ secrets.OVH_DEPLOY_PATH }}
          overwrite: true

      - name: Finalize Laravel deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.OVH_PHP_BIN }}
        with:
          host: ${{ secrets.OVH_HOST }}
          port: ${{ secrets.OVH_PORT }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          envs: DEPLOY_PATH,PHP_BIN
          script: |
            set -e

            PHP_BIN="${PHP_BIN:-php}"

            cd "$DEPLOY_PATH"

            trap '"$PHP_BIN" artisan up || true' EXIT

            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan storage:link || true
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache
            "$PHP_BIN" artisan event:cache
            "$PHP_BIN" artisan queue:restart || true
            "$PHP_BIN" artisan up

            trap - EXIT
